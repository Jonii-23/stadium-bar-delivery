<svg width="1200" height="700" viewBox="0 0 1200 700" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">StadiumServe architecture diagram</title>
  <desc id="desc">Customer sends order to API Gateway, which invokes a Python Lambda that stores data in DynamoDB and publishes SNS notifications to bar staff and delivery staff.</desc>

  <defs>
    <style>
      .title { font: 700 28px Arial, sans-serif; fill: #1f2937; }
      .subtitle { font: 600 18px Arial, sans-serif; fill: #374151; }
      .label { font: 600 16px Arial, sans-serif; fill: #111827; }
      .small { font: 500 14px Arial, sans-serif; fill: #4b5563; }
      .box { fill: #f8fafc; stroke: #2563eb; stroke-width: 2; rx: 18; }
      .box-alt { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2; rx: 18; }
      .db { fill: #ecfdf5; stroke: #16a34a; stroke-width: 2; rx: 18; }
      .sns { fill: #fff7ed; stroke: #f97316; stroke-width: 2; rx: 18; }
      .staff { fill: #fdf2f8; stroke: #db2777; stroke-width: 2; rx: 18; }
      .arrow { stroke: #374151; stroke-width: 3; fill: none; marker-end: url(#arrowhead); }
      .arrow-dashed { stroke: #374151; stroke-width: 3; fill: none; stroke-dasharray: 10 8; marker-end: url(#arrowhead); }
    </style>
    <marker id="arrowhead" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 z" fill="#374151"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1200" height="700" fill="#ffffff"/>
  <text x="600" y="48" text-anchor="middle" class="title">StadiumServe Order Flow</text>

  <!-- Customer -->
  <rect x="60" y="170" width="160" height="120" class="box"/>
  <text x="140" y="220" text-anchor="middle" class="label">Customer</text>
  <text x="140" y="246" text-anchor="middle" class="small">seat number + items</text>

  <!-- API Gateway -->
  <rect x="290" y="170" width="180" height="120" class="box-alt"/>
  <text x="380" y="220" text-anchor="middle" class="label">API Gateway</text>
  <text x="380" y="246" text-anchor="middle" class="small">REST API</text>

  <!-- Lambda -->
  <rect x="540" y="170" width="180" height="120" class="box"/>
  <text x="630" y="220" text-anchor="middle" class="label">Lambda</text>
  <text x="630" y="246" text-anchor="middle" class="small">Python 3.12</text>

  <!-- DynamoDB -->
  <rect x="790" y="170" width="180" height="120" class="db"/>
  <text x="880" y="220" text-anchor="middle" class="label">DynamoDB</text>
  <text x="880" y="246" text-anchor="middle" class="small">Orders table</text>

  <!-- SNS -->
  <rect x="540" y="390" width="260" height="140" class="sns"/>
  <text x="670" y="436" text-anchor="middle" class="label">SNS</text>
  <text x="670" y="462" text-anchor="middle" class="small">notifications topic</text>

  <!-- Bar Staff -->
  <rect x="60" y="390" width="180" height="120" class="staff"/>
  <text x="150" y="440" text-anchor="middle" class="label">Bar Staff</text>
  <text x="150" y="466" text-anchor="middle" class="small">prepare order</text>

  <!-- Delivery Staff -->
  <rect x="930" y="390" width="210" height="120" class="staff"/>
  <text x="1035" y="440" text-anchor="middle" class="label">Delivery Staff</text>
  <text x="1035" y="466" text-anchor="middle" class="small">deliver to seat</text>

  <!-- arrows -->
  <path d="M220 230 H290" class="arrow"/>
  <path d="M470 230 H540" class="arrow"/>
  <path d="M720 230 H790" class="arrow"/>

  <path d="M630 290 V390" class="arrow"/>
  <path d="M540 460 H240" class="arrow-dashed"/>
  <path d="M800 460 H930" class="arrow-dashed"/>

  <text x="255" y="210" class="small">POST /orders</text>
  <text x="495" y="210" class="small">invoke</text>
  <text x="735" y="210" class="small">save order</text>
  <text x="642" y="350" class="small">publish</text>
  <text x="360" y="438" class="small">new order</text>
  <text x="840" y="438" class="small">ready for delivery</text>
</svg>
